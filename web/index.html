<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Server Radar">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Server Radar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span id="status-dot" class="dot c-green"></span><h1>Server Radar</h1><span id="updated" class="muted"></span></div>
    <div class="actions">
      <button data-action="refresh">Refresh</button>
      <button data-action="mark-all-read">Mark all read</button>
    </div>
  </header>
  <main>
    <section id="tiles" class="tiles" aria-label="Summary"></section>
    <section id="patchbar" class="patchbar panel" aria-label="Patch cycle"></section>
    <div class="columns">
      <div class="feed-col" id="feed-anchor"><div id="filters"></div><div id="feed"></div></div>
      <aside class="side-col panel"><h2>Azure Gov, Entra ID &amp; GCC outages</h2>
        <div id="outages"></div>
        <h2 class="sub-section">Azure Government updates</h2><div id="azure"></div></aside>
    </div>
  </main>
  <footer id="sources" class="sources"></footer>
  <script src="bridge.js"></script>
  <script src="patchCycle.js"></script>
  <script src="view.js"></script>
  <script src="app.js"></script>
</body>
</html>
